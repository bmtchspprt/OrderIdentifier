<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BINMASTER | ORD Delta Simple</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        .drop-zone { border: 2px dashed #cbd5e1; transition: all 0.3s ease; }
        .drop-zone.dragover { border-color: #be123c; background-color: #fff1f2; }
        .binmaster-red { background-color: #be123c; }
        .binmaster-red:hover { background-color: #9f1239; }
    </style>
</head>
<body class="bg-gray-100 font-sans">

    <header class="bg-white p-4 shadow-sm border-b-2 border-black">
        <div class="max-w-7xl mx-auto flex items-baseline gap-4">
            <h1 class="text-3xl font-black italic tracking-tighter text-red-700">BINMASTER</h1>
            <div class="flex flex-col">
                <span class="text-xl font-bold text-gray-800 uppercase text-xs uppercase font-semibold">New Order Number Finder</span>
            </div>
        </div>
    </header>

    <main class="max-w-4xl mx-auto p-6 space-y-6">
        
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <div class="bg-white rounded shadow-sm overflow-hidden border border-gray-200">
                <div class="bg-black text-white px-4 py-2 flex items-center gap-2">
                    <span class="bg-red-600 rounded-full w-5 h-5 flex items-center justify-center text-xs font-bold">1</span>
                    <span class="text-xs font-bold uppercase tracking-wider">Baseline File</span>
                </div>
                <div id="drop-baseline" class="drop-zone m-4 p-8 rounded-lg flex flex-col items-center justify-center text-center cursor-pointer">
                    <svg class="w-10 h-10 text-yellow-400 mb-2" fill="currentColor" viewBox="0 0 20 20"><path d="M2 6a2 2 0 012-2h5l2 2h5a2 2 0 012 2v6a2 2 0 01-2 2H4a2 2 0 01-2-2V6z"></path></svg>
                    <p id="name-baseline" class="text-xs text-gray-400 font-bold uppercase">Drag Baseline Here</p>
                    <input type="file" id="file-baseline" class="hidden" accept=".xlsx, .xls, .csv">
                </div>
            </div>

            <div class="bg-white rounded shadow-sm overflow-hidden border border-gray-200">
                <div class="bg-black text-white px-4 py-2 flex items-center gap-2">
                    <span class="bg-red-600 rounded-full w-5 h-5 flex items-center justify-center text-xs font-bold">2</span>
                    <span class="text-xs font-bold uppercase tracking-wider">Current File</span>
                </div>
                <div id="drop-current" class="drop-zone m-4 p-8 rounded-lg flex flex-col items-center justify-center text-center cursor-pointer">
                    <svg class="w-10 h-10 text-yellow-400 mb-2" fill="currentColor" viewBox="0 0 20 20"><path d="M2 6a2 2 0 012-2h5l2 2h5a2 2 0 012 2v6a2 2 0 01-2 2H4a2 2 0 01-2-2V6z"></path></svg>
                    <p id="name-current" class="text-xs text-gray-400 font-bold uppercase">Drag Current Here</p>
                    <input type="file" id="file-current" class="hidden" accept=".xlsx, .xls, .csv">
                </div>
            </div>
        </div>

        <div class="bg-white p-4 rounded border border-gray-200 flex flex-col items-center gap-4 shadow-sm">
            <button id="process-btn" class="binmaster-red text-white px-10 py-3 rounded font-bold uppercase text-sm w-full md:w-auto">
                Compare and List New Orders
            </button>
        </div>

        <div id="results" class="hidden">
            <div class="bg-white border border-gray-200 rounded p-6 shadow-sm">
                <h3 class="text-sm font-black uppercase mb-4 border-b pb-2">Results: New Order Numbers Found</h3>
                <div id="report-output" class="grid grid-cols-2 md:grid-cols-4 gap-2 font-mono text-sm"></div>
                <div id="summary-count" class="mt-4 text-xs font-bold text-gray-500 uppercase"></div>
            </div>
        </div>
    </main>

    <script>
        let dataStore = { baseline: null, current: null };

        function setupDropZone(zoneId, inputId, key) {
            const zone = document.getElementById(zoneId);
            const input = document.getElementById(inputId);
            const nameDisp = document.getElementById(`name-${key}`);

            zone.onclick = () => input.click();
            zone.ondragover = (e) => { e.preventDefault(); zone.classList.add('dragover'); };
            zone.ondragleave = () => zone.classList.remove('dragover');
            zone.ondrop = (e) => {
                e.preventDefault();
                zone.classList.remove('dragover');
                handleFile(e.dataTransfer.files[0], key, nameDisp);
            };
            input.onchange = (e) => handleFile(e.target.files[0], key, nameDisp);
        }

        async function handleFile(file, key, display) {
            if (!file) return;
            display.innerText = file.name;
            display.classList.remove('text-gray-400');
            display.classList.add('text-blue-600');
            const data = await file.arrayBuffer();
            const workbook = XLSX.read(data);
            const firstSheet = workbook.Sheets[workbook.SheetNames[0]];
            dataStore[key] = XLSX.utils.sheet_to_json(firstSheet, { header: 1 });
        }

        setupDropZone('drop-baseline', 'file-baseline', 'baseline');
        setupDropZone('drop-current', 'file-current', 'current');

        document.getElementById('process-btn').onclick = () => {
            if (!dataStore.baseline || !dataStore.current) {
                alert("Please upload both files.");
                return;
            }

            const baselineRows = dataStore.baseline;
            const currentRows = dataStore.current;
            const header = currentRows[0];
            const orderColIndex = header.findIndex(h => String(h).toLowerCase().includes('order'));
            
            if (orderColIndex === -1) {
                alert("Could not find 'Order' column.");
                return;
            }

            // Create a set of all Order IDs in the baseline
            const baselineSet = new Set(baselineRows.slice(1).map(row => String(row[orderColIndex]).trim()));
            
            // Find IDs in Current that aren't in Baseline
            const newOrders = [];
            for (let i = 1; i < currentRows.length; i++) {
                const val = String(currentRows[i][orderColIndex]).trim();
                if (val && !baselineSet.has(val)) {
                    newOrders.push(val);
                }
            }

            const uniqueNewOrders = [...new Set(newOrders)];
            const output = document.getElementById('report-output');
            const summary = document.getElementById('summary-count');
            
            if (uniqueNewOrders.length > 0) {
                output.innerHTML = uniqueNewOrders.map(id => `<div class="bg-gray-50 border p-2 rounded text-center">${id}</div>`).join('');
                summary.innerText = `Total New Orders: ${uniqueNewOrders.length}`;
            } else {
                output.innerHTML = `<div class="col-span-full py-4 text-gray-400 italic">No new order numbers detected.</div>`;
                summary.innerText = "";
            }

            document.getElementById('results').classList.remove('hidden');
        };
    </script>
</body>
</html>
