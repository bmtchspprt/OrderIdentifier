<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BINMASTER | ORD Delta Tool</title>
<script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>
<style>
:root{
  --red: #C8102E; --nav: #1C1C1C;
  --text: #222222; --text-m: #5A6070; --bg: #F5F6F8;
  --white: #FFFFFF; --border: #D2D8E0; --blue: #0060A8;
  --green: #1B6B2F; --r: 4px; --sh: 0 2px 8px rgba(0,0,0,.11);
}
body{font-family: Arial, sans-serif; background:var(--bg); color:var(--text); margin:0; padding:20px; font-size:12px;}

/* Branding: ALL CAPS, ALL RED, BOLD */
.header{max-width:1400px; margin:0 auto 20px; display:flex; align-items:center; gap:15px;}
.logo-mark{font-size:34px; font-weight:900; font-style:italic; letter-spacing:-1.5px; color: var(--red); text-transform: uppercase;}
.title-area h1{font-size:18px; margin:0; text-transform:uppercase; font-weight: 800; color: var(--nav);}

.wrap{max-width:1400px; margin:0 auto; display:grid; gap:20px;}
.drop-grid{display:grid; grid-template-columns: 1fr 1fr; gap:20px;}

.card{background:var(--white); border-radius:var(--r); border:1px solid var(--border); box-shadow:var(--sh); overflow:hidden;}
.card-hd{background:var(--nav); color:var(--white); padding:10px 15px; font-size:11px; font-weight:700; text-transform:uppercase;}

.drop-zone{padding:30px 20px; text-align:center; border:2px dashed var(--border); margin:15px; border-radius:var(--r); transition:0.2s; cursor:pointer; background:#FAFBFF;}
.drop-zone.drag-over{border-color:var(--red); background: #fff1f1;}
.file-name{margin-top:10px; color:var(--blue); font-weight:700;}

.results-area{display:none; margin-top:10px;}
.tbl-wrap{overflow-x:auto; max-height: 750px;}
table{width:100%; border-collapse:collapse; white-space:nowrap;}
th{background:#f0f2f5; text-align:left; padding:10px; font-size:10px; text-transform:uppercase; border-bottom:2px solid var(--border); position:sticky; top:0; z-index: 10;}
td{padding:8px 10px; border-bottom:1px solid var(--border); font-size:11px;}
tr:nth-child(even){background:#fafafa;}
tr:hover{background: #f1f5f9;}
.ord-font{font-weight:700; color:var(--red);}
.unified-col{background: #fff8f8; font-weight: 700; color: var(--blue); border-left: 2px solid var(--border);}

.btn{padding:10px 20px; border-radius:var(--r); border:none; cursor:pointer; font-weight:700; transition:0.2s; font-size:12px;}
.btn-red{background:var(--red); color:white;}
.btn-gray{background:var(--bg); border:1px solid var(--border); color:var(--text-m);}
</style>
</head>
<body>

<div class="header">
  <div class="logo-mark">BINMASTER</div>
  <div class="title-area">
    <h1>Comprehensive ORD Delta</h1>
    <div style="font-size:10px; color:var(--text-m)">Strict Row Extraction: Capturing every line item</div>
  </div>
</div>

<div class="wrap">
  <div class="drop-grid">
    <div class="card">
      <div class="card-hd">Step 1: Baseline (Older Export)</div>
      <div id="dz-old" class="drop-zone" ondrop="handleDrop(event, 'old')" ondragover="handleDrag(event)">
        <strong>Drop OLD Spreadsheet</strong>
        <div id="name-old" class="file-name"></div>
      </div>
    </div>
    <div class="card">
      <div class="card-hd">Step 2: Current (Newer Export)</div>
      <div id="dz-new" class="drop-zone" ondrop="handleDrop(event, 'new')" ondragover="handleDrag(event)">
        <strong>Drop NEW Spreadsheet</strong>
        <div id="name-new" class="file-name"></div>
      </div>
    </div>
  </div>

  <div style="text-align:center; padding: 10px;">
    <button class="btn btn-red" onclick="runComparison()">Analyze All Columns</button>
    <button class="btn btn-gray" onclick="location.reload()">Reset Tool</button>
  </div>

  <div id="results-wrap" class="results-area card">
    <div class="card-hd" style="background:var(--green); display:flex; justify-content:space-between; align-items:center;">
      <span>Comparison Results</span>
      <button class="btn btn-gray" style="padding:5px 10px; font-size:10px;" onclick="copyUnified()">Copy Unified IDs</button>
    </div>
    <div class="tbl-wrap">
      <table id="res-table">
        <thead id="res-thead"></thead>
        <tbody id="res-tbody"></tbody>
      </table>
    </div>
  </div>
</div>

<script>
let store = { oldIds: new Set(), newRows: [], columns: [] };

function handleDrag(e) { e.preventDefault(); e.currentTarget.classList.add('drag-over'); }

function handleDrop(e, type) {
  e.preventDefault();
  e.currentTarget.classList.remove('drag-over');
  const file = e.dataTransfer.files[0];
  if (!file) return;

  document.getElementById(`name-${type}`).innerText = `📄 ${file.name}`;
  
  const reader = new FileReader();
  reader.onload = (event) => {
    const workbook = XLSX.read(new Uint8Array(event.target.result), {type: 'array', cellFormula: false, cellHTML: false});
    const sheet = workbook.Sheets[workbook.SheetNames[0]];
    
    // Aggressive parsing: Treat everything as raw data to prevent skipping "empty" rows
    const rawJson = XLSX.utils.sheet_to_json(sheet, { defval: "", blankrows: true, raw: true });
    
    const processed = processRows(rawJson);

    if (type === 'old') {
      store.oldIds = new Set(processed.map(r => r["Unified ID"]).filter(id => id !== ""));
    } else {
      store.newRows = processed;
      if (rawJson.length > 0) {
          let cols = Object.keys(rawJson[0]);
          let ordIdx = cols.findIndex(k => k.toLowerCase().includes("order #") || k.toLowerCase() === "ord");
          if (ordIdx !== -1) {
              cols.splice(ordIdx + 1, 0, "Unified ID");
          } else {
              cols.push("Unified ID");
          }
          store.columns = cols;
      }
    }
  };
  reader.readAsArrayBuffer(file);
}

function processRows(rows) {
  let lastKnownOrd = "";
  let lastKnownCust = "";
  let lastKnownDate = "";

  return rows.filter(row => {
    // Keep rows that have at least ONE value (like Item # or Description)
    return Object.values(row).some(v => String(v).trim() !== "");
  }).map(row => {
    let ordKey = Object.keys(row).find(k => k.toLowerCase().includes("order #") || k.toLowerCase() === "ord") || "Order #";
    let custKey = Object.keys(row).find(k => k.toLowerCase().includes("customer")) || "Customer";
    let dateKey = Object.keys(row).find(k => k.toLowerCase().includes("date")) || "Ship Date";

    let valOrd = String(row[ordKey] || "").trim();
    let valCust = String(row[custKey] || "").trim();
    let valDate = String(row[dateKey] || "").trim();

    if (valOrd !== "") lastKnownOrd = valOrd;
    if (valCust !== "") lastKnownCust = valCust;
    if (valDate !== "") lastKnownDate = valDate;

    return {
        ...row,
        "Unified ID": lastKnownOrd,
        [custKey]: lastKnownCust,
        [dateKey]: lastKnownDate
    };
  });
}

function runComparison() {
  if (store.oldIds.size === 0 || store.newRows.length === 0) {
    alert("Please upload both files first.");
    return;
  }

  const thead = document.getElementById('res-thead');
  const tbody = document.getElementById('res-tbody');
  thead.innerHTML = ''; tbody.innerHTML = '';

  const trH = document.createElement('tr');
  store.columns.forEach(col => {
    const th = document.createElement('th');
    th.innerText = col;
    trH.appendChild(th);
  });
  thead.appendChild(trH);

  store.newRows.forEach(row => {
    if (row["Unified ID"] && !store.oldIds.has(row["Unified ID"])) {
      const tr = document.createElement('tr');
      store.columns.forEach(col => {
        const td = document.createElement('td');
        td.innerText = row[col] || "";
        if (col === "Unified ID") td.className = "unified-col";
        if (col.toLowerCase().includes("order #") || col.toLowerCase() === "ord") td.className = "ord-font";
        tr.appendChild(td);
      });
      tbody.appendChild(tr);
    }
  });

  document.getElementById('results-wrap').style.display = 'block';
}

function copyUnified() {
  const ids = [...new Set(Array.from(document.querySelectorAll('.unified-col')).map(td => td.innerText))];
  if (ids.length === 0) return;
  navigator.clipboard.writeText(ids.join('\n'));
  alert("Copied to clipboard.");
}
</script>
</body>
</html>
