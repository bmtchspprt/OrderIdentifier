<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BINMASTER | ORD Tool</title>
<script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>
<style>
:root{
  --red: #C8102E; --nav: #1C1C1C;
  --text: #222222; --text-m: #5A6070; --bg: #F5F6F8;
  --white: #FFFFFF; --border: #D2D8E0; --blue: #0060A8;
  --green: #1B6B2F; --r: 4px; --sh: 0 2px 8px rgba(0,0,0,.11);
}
body{font-family: Arial, sans-serif; background:var(--bg); color:var(--text); margin:0; padding:20px; font-size:12px;}

.header{max-width:1400px; margin:0 auto 20px; display:flex; align-items:center; gap:15px;}
.logo-mark{font-size:34px; font-weight:900; font-style:italic; letter-spacing:-1.5px; color: var(--red); text-transform: uppercase;}
.title-area h1{font-size:18px; margin:0; text-transform:uppercase; font-weight: 800; color: var(--nav);}

.wrap{max-width:1400px; margin:0 auto;}
.drop-grid{display:grid; grid-template-columns: 1fr 1fr; gap:20px; margin-bottom: 20px;}

.card{background:var(--white); border-radius:var(--r); border:1px solid var(--border); box-shadow:var(--sh); overflow:hidden; margin-bottom: 20px;}
.card-hd{background:var(--nav); color:var(--white); padding:10px 15px; font-size:11px; font-weight:700; text-transform:uppercase;}

.drop-zone{padding:40px 20px; text-align:center; border:2px dashed var(--border); margin:15px; border-radius:var(--r); cursor:pointer; background:#FAFBFF; transition: 0.2s;}
.drop-zone:hover{background: #f0f4ff; border-color: var(--blue);}
.drop-zone.drag-over{border-color:var(--red); background: #fff1f1;}

.btn-row{text-align:center; padding: 20px; background: white; border: 1px solid var(--border); border-radius: var(--r); margin-bottom: 20px;}
.btn{padding:12px 24px; border-radius:var(--r); border:none; cursor:pointer; font-weight:700; font-size:13px; margin: 0 10px; text-transform: uppercase;}
.btn-red{background:var(--red); color:white;}
.btn-gray{background:#e0e0e0; color:var(--nav);}

.tbl-wrap{overflow-x:auto; max-height: 600px;}
table{width:100%; border-collapse:collapse; white-space:nowrap;}
th{background:#f0f2f5; text-align:left; padding:10px; font-size:10px; border-bottom:2px solid var(--border); position:sticky; top:0; z-index:10;}
td{padding:8px 10px; border-bottom:1px solid var(--border); font-size:11px;}
.unified-col{background: #eef4ff; font-weight: 800; color: var(--blue);}
.ord-font{font-weight:700; color:var(--red);}
</style>
</head>
<body>

<div class="header">
  <div class="logo-mark">BINMASTER</div>
  <div class="title-area">
    <h1>Comprehensive ORD Delta</h1>
    <div style="font-size:10px; color:var(--text-m)">Unified ID Auditor</div>
  </div>
</div>

<div class="wrap">
  <div class="drop-grid">
    <div class="card">
      <div class="card-hd">Step 1: Baseline (Older Export)</div>
      <div class="drop-zone" id="dz-old" 
           onclick="document.getElementById('in-old').click()"
           ondragover="hDrag(event)" ondragleave="hLeave(event)" ondrop="hDrop(event, 'old')">
        <strong>Drag Baseline File Here</strong><br>or Click to Select
        <input type="file" id="in-old" hidden onchange="hInput(this, 'old')">
        <div id="name-old" style="margin-top:10px; color:var(--blue); font-weight:bold;"></div>
      </div>
    </div>

    <div class="card">
      <div class="card-hd">Step 2: Current (Newer Export)</div>
      <div class="drop-zone" id="dz-new" 
           onclick="document.getElementById('in-new').click()"
           ondragover="hDrag(event)" ondragleave="hLeave(event)" ondrop="hDrop(event, 'new')">
        <strong>Drag Current File Here</strong><br>or Click to Select
        <input type="file" id="in-new" hidden onchange="hInput(this, 'new')">
        <div id="name-new" style="margin-top:10px; color:var(--blue); font-weight:bold;"></div>
      </div>
    </div>
  </div>

  <div class="btn-row">
    <button class="btn btn-gray" onclick="showPreview()">1. Preview Unified IDs</button>
    <button class="btn btn-red" onclick="runComparison()">2. Run Delta Comparison</button>
  </div>

  <div id="out-card" class="card" style="display:none;">
    <div class="card-hd" id="out-hd">Results</div>
    <div class="tbl-wrap">
      <table id="main-table"><thead></thead><tbody></tbody></table>
    </div>
  </div>
</div>

<script>
let store = { oldIds: new Set(), newRows: [], columns: [] };

// Handlers for Drop/Input
function hDrag(e) { e.preventDefault(); e.currentTarget.classList.add('drag-over'); }
function hLeave(e) { e.currentTarget.classList.remove('drag-over'); }
function hInput(el, type) { if(el.files[0]) processFile(el.files[0], type); }
function hDrop(e, type) { 
    e.preventDefault(); 
    e.currentTarget.classList.remove('drag-over');
    if(e.dataTransfer.files[0]) processFile(e.dataTransfer.files[0], type); 
}

function processFile(file, type) {
    document.getElementById(`name-${type}`).innerText = "Loading: " + file.name;
    const reader = new FileReader();
    reader.onload = (e) => {
        const wb = XLSX.read(new Uint8Array(e.target.result), {type: 'array'});
        const raw = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], {defval: "", blankrows: true});
        const processed = cleanData(raw);

        if(type === 'old') {
            store.oldIds = new Set(processed.map(r => r["Unified ID"]).filter(id => id !== ""));
            document.getElementById(`name-old`).innerText = "✅ " + file.name;
        } else {
            store.newRows = processed;
            let cols = Object.keys(raw[0] || {});
            let idx = cols.findIndex(k => k.toLowerCase().includes("order #") || k.toLowerCase() === "ord");
            cols.splice(idx + 1, 0, "Unified ID");
            store.columns = cols;
            document.getElementById(`name-new`).innerText = "✅ " + file.name;
        }
    };
    reader.readAsArrayBuffer(file);
}

function cleanData(rows) {
    let lastID = "", lastCust = "";
    return rows.filter(r => Object.values(r).some(v => String(v).trim() !== "")).map(row => {
        let oK = Object.keys(row).find(k => k.toLowerCase().includes("order #") || k.toLowerCase() === "ord") || "Order #";
        let cK = Object.keys(row).find(k => k.toLowerCase().includes("customer")) || "Customer";
        
        let vO = String(row[oK] || "").trim();
        let vC = String(row[cK] || "").trim();

        if (vO !== "") lastID = vO;
        if (vC !== "") lastCust = vC;

        return { ...row, "Unified ID": lastID, [cK]: lastCust };
    });
}

function render(dataRows, title, highlightDelta) {
    const card = document.getElementById('out-card');
    const hd = document.getElementById('out-hd');
    const thead = document.querySelector('#main-table thead');
    const tbody = document.querySelector('#main-table tbody');
    
    hd.innerText = title;
    thead.innerHTML = ''; tbody.innerHTML = '';

    const trH = document.createElement('tr');
    store.columns.forEach(c => { const th = document.createElement('th'); th.innerText = c; trH.appendChild(th); });
    thead.appendChild(trH);

    dataRows.forEach(row => {
        if (!highlightDelta || (row["Unified ID"] && !store.oldIds.has(row["Unified ID"]))) {
            const tr = document.createElement('tr');
            store.columns.forEach(col => {
                const td = document.createElement('td');
                td.innerText = row[col] || "";
                if (col === "Unified ID") td.className = "unified-col";
                if (col.toLowerCase().includes("order #")) td.className = "ord-font";
                tr.appendChild(td);
            });
            tbody.appendChild(tr);
        }
    });
    card.style.display = 'block';
}

function showPreview() {
    if(store.newRows.length === 0) return alert("Upload 'Current' file first.");
    render(store.newRows, "Full Audit: Checking Unified ID Fill-Down", false);
}

function runComparison() {
    if(store.oldIds.size === 0 || store.newRows.length === 0) return alert("Upload both files.");
    render(store.newRows, "Delta Results: New Orders Only", true);
}
</script>
</body>
</html>
