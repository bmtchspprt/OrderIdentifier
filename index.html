<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BINMASTER | Full Preview Delta Tool</title>
<script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>
<style>
:root{
  --red: #C8102E; --nav: #1C1C1C;
  --text: #222222; --text-m: #5A6070; --bg: #F5F6F8;
  --white: #FFFFFF; --border: #D2D8E0; --blue: #0060A8;
  --green: #1B6B2F; --r: 4px; --sh: 0 2px 8px rgba(0,0,0,.11);
}
body{font-family: Arial, sans-serif; background:var(--bg); color:var(--text); margin:0; padding:20px; font-size:12px;}

.header{max-width:1400px; margin:0 auto 20px; display:flex; align-items:center; gap:15px;}
.logo-mark{font-size:34px; font-weight:900; font-style:italic; letter-spacing:-1.5px; color: var(--red); text-transform: uppercase;}
.title-area h1{font-size:18px; margin:0; text-transform:uppercase; font-weight: 800; color: var(--nav);}

.wrap{max-width:1400px; margin:0 auto; display:grid; gap:20px;}
.drop-grid{display:grid; grid-template-columns: 1fr 1fr; gap:20px;}

.card{background:var(--white); border-radius:var(--r); border:1px solid var(--border); box-shadow:var(--sh); overflow:hidden; margin-bottom: 20px;}
.card-hd{background:var(--nav); color:var(--white); padding:10px 15px; font-size:11px; font-weight:700; text-transform:uppercase; display:flex; justify-content:space-between;}

.drop-zone{padding:30px 20px; text-align:center; border:2px dashed var(--border); margin:15px; border-radius:var(--r); cursor:pointer; background:#FAFBFF;}
.drop-zone.drag-over{border-color:var(--red); background: #fff1f1;}

.tbl-wrap{overflow-x:auto; max-height: 500px;}
table{width:100%; border-collapse:collapse; white-space:nowrap;}
th{background:#f0f2f5; text-align:left; padding:10px; font-size:10px; border-bottom:2px solid var(--border); position:sticky; top:0; z-index:10;}
td{padding:8px 10px; border-bottom:1px solid var(--border); font-size:11px;}
tr:nth-child(even){background:#fafafa;}

.ord-font{font-weight:700; color:var(--red);}
.unified-col{background: #eef4ff; font-weight: 800; color: var(--blue); border-left: 2px solid var(--border);}

.btn{padding:10px 20px; border-radius:var(--r); border:none; cursor:pointer; font-weight:700; font-size:12px; margin: 0 5px;}
.btn-red{background:var(--red); color:white;}
.btn-gray{background:var(--bg); border:1px solid var(--border); color:var(--text-m);}
</style>
</head>
<body>

<div class="header">
  <div class="logo-mark">BINMASTER</div>
  <div class="title-area">
    <h1>Comprehensive ORD Delta</h1>
    <div style="font-size:10px; color:var(--text-m)">Full Spreadsheet Audit Mode</div>
  </div>
</div>

<div class="wrap">
  <div class="drop-grid">
    <div class="card">
      <div class="card-hd">Step 1: Baseline (Older)</div>
      <div id="dz-old" class="drop-zone" ondrop="handleDrop(event, 'old')" ondragover="e=>e.preventDefault()">
        <strong>Drop OLD Spreadsheet</strong>
        <div id="name-old" style="margin-top:5px; color:var(--blue);"></div>
      </div>
    </div>
    <div class="card">
      <div class="card-hd">Step 2: Current (Newer)</div>
      <div id="dz-new" class="drop-zone" ondrop="handleDrop(event, 'new')" ondragover="e=>e.preventDefault()">
        <strong>Drop NEW Spreadsheet</strong>
        <div id="name-new" style="margin-top:5px; color:var(--blue);"></div>
      </div>
    </div>
  </div>

  <div style="text-align:center; padding-bottom: 20px;">
    <button class="btn btn-gray" onclick="togglePreview()">Preview Full Spreadsheet</button>
    <button class="btn btn-red" onclick="runComparison()">Run Delta Comparison</button>
  </div>

  <!-- PREVIEW AREA -->
  <div id="preview-wrap" class="card" style="display:none;">
    <div class="card-hd" style="background:#444;">FULL SPREADSHEET PREVIEW (Audit Unified IDs)</div>
    <div class="tbl-wrap"><table id="preview-table"><thead></thead><tbody></tbody></table></div>
  </div>

  <!-- RESULTS AREA -->
  <div id="results-wrap" class="card" style="display:none;">
    <div class="card-hd" style="background:var(--green);">COMPARISON RESULTS (New Orders Only)</div>
    <div class="tbl-wrap"><table id="res-table"><thead></thead><tbody></tbody></table></div>
  </div>
</div>

<script>
let store = { oldIds: new Set(), newRows: [], columns: [] };

function handleDrop(e, type) {
  e.preventDefault();
  const file = e.dataTransfer.files[0];
  if (!file) return;
  document.getElementById(`name-${type}`).innerText = file.name;

  const reader = new FileReader();
  reader.onload = (event) => {
    const workbook = XLSX.read(new Uint8Array(event.target.result), {type: 'array'});
    const sheet = workbook.Sheets[workbook.SheetNames[0]];
    const rawJson = XLSX.utils.sheet_to_json(sheet, { defval: "", blankrows: true });
    
    const processed = processData(rawJson);

    if (type === 'old') {
      store.oldIds = new Set(processed.map(r => r["Unified ID"]).filter(id => id !== ""));
    } else {
      store.newRows = processed;
      // Setup Columns
      let cols = Object.keys(rawJson[0] || {});
      let ordIdx = cols.findIndex(k => k.toLowerCase().includes("order #") || k.toLowerCase() === "ord");
      cols.splice(ordIdx + 1, 0, "Unified ID");
      store.columns = cols;
    }
  };
  reader.readAsArrayBuffer(file);
}

function processData(rows) {
  let currentID = "";
  let currentCust = "";
  // We strictly keep rows that have data in ANY column (like the missing 299-0922 item)
  return rows.filter(r => Object.values(r).some(v => String(v).trim() !== "")).map(row => {
    let ordKey = Object.keys(row).find(k => k.toLowerCase().includes("order #") || k.toLowerCase() === "ord") || "Order #";
    let custKey = Object.keys(row).find(k => k.toLowerCase().includes("customer")) || "Customer";
    
    let valOrd = String(row[ordKey] || "").trim();
    let valCust = String(row[custKey] || "").trim();

    if (valOrd !== "") currentID = valOrd;
    if (valCust !== "") currentCust = valCust;

    return { ...row, "Unified ID": currentID, [custKey]: currentCust };
  });
}

function togglePreview() {
  const wrap = document.getElementById('preview-wrap');
  if (store.newRows.length === 0) return alert("Upload 'New' file first.");
  
  const thead = document.querySelector('#preview-table thead');
  const tbody = document.querySelector('#preview-table tbody');
  thead.innerHTML = ''; tbody.innerHTML = '';

  const trH = document.createElement('tr');
  store.columns.forEach(c => { const th = document.createElement('th'); th.innerText = c; trH.appendChild(th); });
  thead.appendChild(trH);

  store.newRows.forEach(row => {
    const tr = document.createElement('tr');
    store.columns.forEach(col => {
      const td = document.createElement('td');
      td.innerText = row[col] || "";
      if (col === "Unified ID") td.className = "unified-col";
      tr.appendChild(td);
    });
    tbody.appendChild(tr);
  });
  wrap.style.display = 'block';
}

function runComparison() {
  if (store.oldIds.size === 0 || store.newRows.length === 0) return alert("Upload both files.");
  
  const wrap = document.getElementById('results-wrap');
  const thead = document.querySelector('#res-table thead');
  const tbody = document.querySelector('#res-table tbody');
  thead.innerHTML = ''; tbody.innerHTML = '';

  const trH = document.createElement('tr');
  store.columns.forEach(c => { const th = document.createElement('th'); th.innerText = c; trH.appendChild(th); });
  thead.appendChild(trH);

  store.newRows.forEach(row => {
    if (row["Unified ID"] && !store.oldIds.has(row["Unified ID"])) {
      const tr = document.createElement('tr');
      store.columns.forEach(col => {
        const td = document.createElement('td');
        td.innerText = row[col] || "";
        if (col === "Unified ID") td.className = "unified-col";
        if (col.toLowerCase().includes("order #")) td.className = "ord-font";
        tr.appendChild(td);
      });
      tbody.appendChild(tr);
    }
  });
  wrap.style.display = 'block';
}
</script>
</body>
</html>
